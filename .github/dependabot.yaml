version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
    labels:
      - "area/dependency/go"

  - package-ecosystem: github-actions
    directories:
      - ".github/workflows"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:05"
    labels:
      - "area/dependency/actions"
