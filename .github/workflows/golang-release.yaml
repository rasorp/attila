name: Golang - Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  invoke-lint:
    name: "Invoke Lint"
    uses: ./.github/workflows/golang-lint.yaml
  invoke-test:
    name: "Invoke Test"
    uses: ./.github/workflows/golang-test.yaml
  invoke-compile:
    name: "Invoke Compile"
    uses: ./.github/workflows/golang-compile.yaml
  release:
    name: "Create Release"
    runs-on: ubuntu-24.04
    needs: [invoke-lint, invoke-test, invoke-compile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: "Identify Version"
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: "Create archives"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release

          for PLATFORM in linux darwin freebsd; do
            for ARCH in amd64 arm64; do
              cd artifacts/attila_${PLATFORM}-${ARCH}
              chmod +x attila
              tar -czf ../../release/attila_${VERSION}_${PLATFORM}_${ARCH}.tar.gz attila
              cd ../..
            done
          done
      - name: "Create checksums"
        run: |
          cd release
          sha256sum -- *.tar.gz > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            release/attila_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            release/attila_${{ steps.version.outputs.version }}_linux_arm64.tar.gz
            release/attila_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
            release/attila_${{ steps.version.outputs.version }}_darwin_arm64.tar.gz
            release/attila_${{ steps.version.outputs.version }}_freebsd_amd64.tar.gz
            release/attila_${{ steps.version.outputs.version }}_freebsd_arm64.tar.gz
            release/checksums.txt
