name: Golang - Test
on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: "Run test"
        run: |
          make test-deps
          make test
