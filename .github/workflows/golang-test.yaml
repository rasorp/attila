name: Golang - Test
on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
jobs:
  test:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "build/.go-version"
      - name: "Run test"
        run: |
          make test-deps
          make test
